<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Penguin Workshop — Qiu Peng (Eren9523)">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7E8EF"/>
      <stop offset="35%" stop-color="#D9E7F5"/>
      <stop offset="70%" stop-color="#B8D4EE"/>
      <stop offset="100%" stop-color="#9EC0E0"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A9C7E4" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#8FB3D6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7AA0C4" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="frost" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.78"/>
      <stop offset="82%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="snowcap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8EEF5"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <clipPath id="round">
      <rect x="0" y="0" width="1200" height="400" rx="28" ry="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- Dawn sky -->
    <rect width="1200" height="400" fill="url(#sky)"/>
    <!-- Soft pink glow -->
    <ellipse cx="780" cy="90" rx="260" ry="70" fill="#F4C9D6" opacity="0.35"/>
    <ellipse cx="980" cy="140" rx="180" ry="50" fill="#FFE6C8" opacity="0.25"/>

    <!-- Distant mountains -->
    <path d="M420,250 L520,140 L600,200 L680,110 L780,190 L860,130 L980,210 L1100,150 L1200,220 L1200,400 L420,400 Z" fill="#7F9BB8" opacity="0.45"/>
    <path d="M480,250 L560,165 L620,210 L700,130 L790,205 L870,155 L960,230 L1200,180 L1200,400 L480,400 Z" fill="#6E8EAE"/>
    <!-- Snow caps -->
    <path d="M560,165 L580,145 L600,165 L585,158 Z" fill="url(#snowcap)"/>
    <path d="M700,130 L725,100 L755,145 L730,132 Z" fill="url(#snowcap)"/>
    <path d="M870,155 L895,125 L920,160 L900,148 Z" fill="url(#snowcap)"/>
    <path d="M1100,150 L1130,118 L1165,165 L1135,150 Z" fill="url(#snowcap)"/>

    <!-- Near ridge -->
    <path d="M550,280 L640,210 L720,255 L820,190 L920,260 L1020,215 L1200,270 L1200,400 L550,400 Z" fill="#5F7F9F"/>
    <path d="M640,210 L665,188 L690,220 L668,208 Z" fill="url(#snowcap)"/>
    <path d="M820,190 L848,160 L880,215 L850,198 Z" fill="url(#snowcap)"/>

    <!-- Lake -->
    <path d="M500,300 C620,285 760,295 900,310 C1000,320 1100,315 1200,325 L1200,400 L500,400 Z" fill="url(#lake)"/>
    <!-- Reflections -->
    <path d="M700,320 L725,300 L750,325" stroke="#DDE8F2" stroke-width="3" fill="none" opacity="0.5"/>
    <path d="M850,330 L875,305 L905,335" stroke="#E8F0F8" stroke-width="3" fill="none" opacity="0.45"/>
    <path d="M980,335 L1010,312 L1040,340" stroke="#EEF4FA" stroke-width="2.5" fill="none" opacity="0.4"/>
    <!-- Soft shore mist -->
    <ellipse cx="900" cy="318" rx="280" ry="18" fill="#FFFFFF" opacity="0.2"/>

    <!-- Rock + penguin (right) -->
    <ellipse cx="980" cy="340" rx="70" ry="22" fill="#3A4550" opacity="0.35"/>
    <path d="M920,345 C930,320 960,305 990,308 C1020,312 1035,330 1040,350 C1010,360 950,360 920,345 Z" fill="#4A5562"/>
    <path d="M935,338 C950,322 980,318 1005,325 C1020,330 1028,342 1028,348 C1000,352 955,352 935,338 Z" fill="#5A6572"/>

    <!-- Penguin -->
    <g transform="translate(955,250)">
      <!-- body -->
      <ellipse cx="30" cy="55" rx="28" ry="36" fill="#1B2430"/>
      <ellipse cx="30" cy="60" rx="18" ry="26" fill="#F4F7FA"/>
      <!-- head -->
      <circle cx="30" cy="22" r="18" fill="#1B2430"/>
      <ellipse cx="30" cy="26" rx="11" ry="10" fill="#F4F7FA"/>
      <!-- eyes -->
      <circle cx="25" cy="22" r="2.2" fill="#111"/>
      <circle cx="35" cy="22" r="2.2" fill="#111"/>
      <circle cx="25.6" cy="21.4" r="0.7" fill="#fff"/>
      <circle cx="35.6" cy="21.4" r="0.7" fill="#fff"/>
      <!-- beak -->
      <path d="M30,25 L26,29 L34,29 Z" fill="#F0A04B"/>
      <!-- blush -->
      <ellipse cx="20" cy="28" rx="3" ry="2" fill="#F5B5B5" opacity="0.7"/>
      <ellipse cx="40" cy="28" rx="3" ry="2" fill="#F5B5B5" opacity="0.7"/>
      <!-- flippers -->
      <path d="M6,48 Q0,60 8,72" stroke="#1B2430" stroke-width="7" stroke-linecap="round" fill="none"/>
      <path d="M54,48 Q60,60 52,72" stroke="#1B2430" stroke-width="7" stroke-linecap="round" fill="none"/>
      <!-- feet -->
      <path d="M18,90 Q22,96 28,90" stroke="#F0A04B" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M32,90 Q36,96 42,90" stroke="#F0A04B" stroke-width="4" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Handwriting -->
    <text x="860" y="210" fill="#FFFFFF" font-size="18" font-family="Georgia, 'Times New Roman', serif" font-style="italic" opacity="0.95">Same curiosity. A bigger tomorrow.</text>
    <text x="900" y="385" fill="#FFFFFF" font-size="14" font-family="Georgia, 'Times New Roman', serif" font-style="italic" opacity="0.9">Ideas · Build · Iterate · Repeat ♡</text>

    <!-- Frosted glass panel (LEFT, white — not dark) -->
    <rect x="0" y="0" width="640" height="400" fill="url(#frost)"/>
    <!-- subtle glass edge -->
    <rect x="0" y="0" width="560" height="400" fill="#FFFFFF" opacity="0.12"/>

    <!-- Title -->
    <text x="48" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="700">
      <tspan fill="#111827">Penguin </tspan><tspan fill="#2563EB">Workshop</tspan>
    </text>
    <!-- Slogan -->
    <text x="48" y="112" fill="#4B5563" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-style="italic">small ideas, carefully built.</text>

    <!-- Bio -->
    <text x="48" y="160" fill="#374151" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
      <tspan x="48" dy="0">Hi, I&#39;m Qiu Peng (Eren9523) — an AI-native product builder.</tspan>
      <tspan x="48" dy="22">I turn small ideas into real tools at the intersection of AI,</tspan>
      <tspan x="48" dy="22">web, and everyday workflows — then keep iterating.</tspan>
    </text>

    <!-- Tags (icons as shapes for reliable render) -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#374151">
      <rect x="48" y="250" rx="14" ry="14" width="96" height="28" fill="#F3F4F6" stroke="#E5E7EB"/>
      <circle cx="64" cy="264" r="4" fill="none" stroke="#6B7280" stroke-width="1.4"/>
      <circle cx="64" cy="264" r="1.2" fill="#6B7280"/>
      <text x="74" y="268">Wuhan</text>

      <rect x="154" y="250" rx="14" ry="14" width="78" height="28" fill="#F3F4F6" stroke="#E5E7EB"/>
      <path d="M166,266 C166,262 170,260 172,264 C174,260 178,262 178,266 C178,270 172,274 172,274 C172,274 166,270 166,266 Z" fill="#EF4444"/>
      <text x="184" y="268">Build</text>

      <rect x="242" y="250" rx="14" ry="14" width="82" height="28" fill="#F3F4F6" stroke="#E5E7EB"/>
      <path d="M254,258 h10 v12 h-10 z" fill="none" stroke="#6B7280" stroke-width="1.4"/>
      <path d="M256,261 h6 M256,265 h6 M256,269 h4" stroke="#6B7280" stroke-width="1.1"/>
      <text x="270" y="268">Learn</text>

      <rect x="334" y="250" rx="14" ry="14" width="90" height="28" fill="#F3F4F6" stroke="#E5E7EB"/>
      <path d="M346,270 L352,258 L358,270" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M349,266 h6" stroke="#6B7280" stroke-width="1.3"/>
      <text x="364" y="268">Iterate</text>

      <rect x="434" y="250" rx="14" ry="14" width="108" height="28" fill="#EFF6FF" stroke="#BFDBFE"/>
      <text x="448" y="268" fill="#1D4ED8" font-weight="600">∞  AI-native</text>
    </g>
  </g>

  <!-- Rounded border -->
  <rect x="0.5" y="0.5" width="1199" height="399" rx="28" ry="28" fill="none" stroke="#E5E7EB" stroke-width="1"/>
</svg>
