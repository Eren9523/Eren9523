<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="310" viewBox="0 0 1140 310" role="img" aria-label="Build philosophy: Observe, Prototype, Ship, Iterate. Tech stack: Python, TypeScript, React, Next.js, Node.js, Vite, Tailwind, Cloudflare, Gemini, DeepSeek.">
  <defs>
    <style type="text/css"><![CDATA[
      .font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .header { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; fill: #111827; }
      .num { font-size: 12px; font-weight: 600; fill: #3B82F6; }
      .title { font-size: 14px; font-weight: 600; fill: #111827; }
      .desc { font-size: 12px; font-weight: 400; fill: #57606A; }
      .pill { font-size: 12px; font-weight: 500; fill: #4B5563; }
      .caption { font-size: 11px; font-weight: 400; fill: #8B949E; }
    ]]></style>
  </defs>

  <!-- Outer frame -->
  <rect x="0.5" y="0.5" width="1139" height="309" rx="14" ry="14" fill="#FFFFFF" stroke="#EAECEF" stroke-width="1"/>

  <!-- ========== LEFT: BUILD PHILOSOPHY (~62%) ========== -->
  <!-- Accent bar -->
  <rect x="28" y="26" width="3" height="14" rx="1.5" fill="#3B82F6"/>
  <text class="font header" x="40" y="37">BUILD PHILOSOPHY</text>

  <!-- Step 01 Observe -->
  <g transform="translate(28, 58)">
    <!-- eye icon -->
    <g transform="translate(0, 2)" fill="none" stroke="#3B82F6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="8" cy="8" rx="7" ry="4.5"/>
      <circle cx="8" cy="8" r="2" fill="#3B82F6" stroke="none"/>
    </g>
    <text class="font num" x="28" y="12">01</text>
    <text class="font title" x="52" y="12">Observe</text>
    <text class="font desc" x="28" y="32">Look closer. Good ideas often start from real life.</text>
  </g>
  <line x1="28" y1="102" x2="680" y2="102" stroke="#EAECEF" stroke-width="1"/>

  <!-- Step 02 Prototype -->
  <g transform="translate(28, 116)">
    <!-- bulb icon -->
    <g transform="translate(0, 1)" fill="none" stroke="#3B82F6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 2.5 C5 2.5 3 5 3 7.5 C3 9.5 4.2 10.8 5.2 11.8 L5.2 14 L10.8 14 L10.8 11.8 C11.8 10.8 13 9.5 13 7.5 C13 5 11 2.5 8 2.5 Z"/>
      <line x1="6" y1="16" x2="10" y2="16"/>
    </g>
    <text class="font num" x="28" y="12">02</text>
    <text class="font title" x="52" y="12">Prototype</text>
    <text class="font desc" x="28" y="32">Use AI to compress the distance between idea and implementation.</text>
  </g>
  <line x1="28" y1="160" x2="680" y2="160" stroke="#EAECEF" stroke-width="1"/>

  <!-- Step 03 Ship -->
  <g transform="translate(28, 174)">
    <!-- plane / paper-plane icon -->
    <g transform="translate(0, 2)" fill="none" stroke="#3B82F6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 8 L14 3 L9 14 L7.5 9.5 L2 8 Z"/>
      <line x1="14" y1="3" x2="7.5" y2="9.5"/>
    </g>
    <text class="font num" x="28" y="12">03</text>
    <text class="font title" x="52" y="12">Ship</text>
    <text class="font desc" x="28" y="32">Turn it into something people can actually use.</text>
  </g>
  <line x1="28" y1="218" x2="680" y2="218" stroke="#EAECEF" stroke-width="1"/>

  <!-- Step 04 Iterate -->
  <g transform="translate(28, 232)">
    <!-- refresh icon -->
    <g transform="translate(0, 2)" fill="none" stroke="#3B82F6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13.5 6 A6 6 0 1 0 13 12.5"/>
      <polyline points="13.5,2.5 13.5,6 10,6"/>
    </g>
    <text class="font num" x="28" y="12">04</text>
    <text class="font title" x="52" y="12">Iterate</text>
    <text class="font desc" x="28" y="32">See what breaks, what users want, and keep going.</text>
  </g>

  <!-- ========== VERTICAL DIVIDER ========== -->
  <line x1="708" y1="24" x2="708" y2="286" stroke="#EAECEF" stroke-width="1"/>

  <!-- ========== RIGHT: TECH STACK (~38%) ========== -->
  <text class="font header" x="736" y="37">TECH STACK</text>

  <!-- Pills — dense wrap, gray -->
  <!-- Row 1 -->
  <g transform="translate(736, 58)">
    <rect x="0" y="0" width="62" height="26" rx="13" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
    <text class="font pill" x="31" y="17" text-anchor="middle">Python</text>

    <rect x="70" y="0" width="84" height="26" rx="13" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
    <text class="font pill" x="112" y="17" text-anchor="middle">TypeScript</text>

    <rect x="162" y="0" width="56" height="26" rx="13" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
    <text class="font pill" x="190" y="17" text-anchor="middle">React</text>

    <rect x="226" y="0" width="68" height="26" rx="13" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
    <text class="font pill" x="260" y="17" text-anchor="middle">Next.js</text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(736, 94)">
    <rect x="0" y="0" width="68" height="26" rx="13" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
    <text class="font pill" x="34" y="17" text-anchor="middle">Node.js</text>

    <rect x="76" y="0" width="48" height="26" rx="13" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
    <text class="font pill" x="100" y="17" text-anchor="middle">Vite</text>

    <rect x="132" y="0" width="72" height="26" rx="13" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
    <text class="font pill" x="168" y="17" text-anchor="middle">Tailwind</text>

    <rect x="212" y="0" width="88" height="26" rx="13" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
    <text class="font pill" x="256" y="17" text-anchor="middle">Cloudflare</text>
  </g>

  <!-- Row 3 -->
  <g transform="translate(736, 130)">
    <rect x="0" y="0" width="68" height="26" rx="13" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
    <text class="font pill" x="34" y="17" text-anchor="middle">Gemini</text>

    <rect x="76" y="0" width="80" height="26" rx="13" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
    <text class="font pill" x="116" y="17" text-anchor="middle">DeepSeek</text>
  </g>

  <!-- Caption -->
  <text class="font caption" x="736" y="186">From real usage across featured repos only.</text>
</svg>
